name: Finalize Web Release

on:
  workflow_call:
    inputs:
      deployed_sha:
        description: Exact commit successfully deployed by the hosting workflow.
        required: true
        type: string
      hosting_target:
        description: Hosting platform that completed the deployment.
        required: true
        type: string
      align_beta:
        description: Fast-forward Beta to the deployed Main release after publication.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Require Firebase Hosting caller
        env:
          HOSTING_TARGET: ${{ inputs.hosting_target }}
        run: |
          if [ "$HOSTING_TARGET" != "firebase-hosting" ]; then
            echo "::error::Release finalization is allowed only after a Firebase Hosting deployment."
            exit 1
          fi

      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.deployed_sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate release version files
        run: yarn version:validate

      - name: Validate GitHub Pages deployment freeze
        run: yarn validate:deployment-freeze

      - name: Verify deployed commit belongs to main
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main

      - name: Read prepared version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release commit identity
        id: release-pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.deployed_sha }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          SUBJECT="$(git log -1 --format=%s "$RELEASE_SHA")"
          ESCAPED_VERSION="${VERSION//./\\.}"

          if [[ "$SUBJECT" =~ ^Release\ v${ESCAPED_VERSION}\ \(#([0-9]+)\)$ ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
          elif [[ "$SUBJECT" =~ ^Merge\ pull\ request\ \#([0-9]+)\ from\ [^/]+/release/next$ ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
          else
            echo "::error::Deployed commit must be a Release v$VERSION PR merge. Found: $SUBJECT"
            exit 1
          fi

          PR_DATA="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          PR_TITLE="$(jq -r '.title' <<< "$PR_DATA")"
          PR_BASE="$(jq -r '.base.ref' <<< "$PR_DATA")"
          PR_HEAD="$(jq -r '.head.ref' <<< "$PR_DATA")"
          PR_MERGE_SHA="$(jq -r '.merge_commit_sha' <<< "$PR_DATA")"
          PR_MERGED_AT="$(jq -r '.merged_at // empty' <<< "$PR_DATA")"

          if [[ "$PR_TITLE" != "Release v$VERSION" || "$PR_BASE" != "main" || "$PR_HEAD" != "release/next" || -z "$PR_MERGED_AT" || "$PR_MERGE_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::PR #$PR_NUMBER does not identify the deployed Release v$VERSION merge ($RELEASE_SHA)."
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Validated Release v$VERSION PR #$PR_NUMBER at $RELEASE_SHA."

      - name: Generate immutable release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          yarn release:notes
          --version "$VERSION"
          --output tmp/release-notes.customer.md
          --engineering-output tmp/release-notes.engineering.md
          --metadata-output tmp/release-notes.json
          --allow-empty

      - name: Use approved customer release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.release-pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.body' | \
            node scripts/extractReleasePullRequestNotes.cjs \
              --version "$VERSION" \
              --output tmp/release-notes.customer.md \
              --metadata-output tmp/release-notes.json

      - name: Resolve immutable release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        shell: bash
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$TAG_SHA" != "$DEPLOYED_SHA" ]; then
              echo "::error::Tag $TAG points to $TAG_SHA instead of deployed commit $DEPLOYED_SHA."
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if ! git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
              echo "::error::GitHub Release $TAG exists without a fetched matching tag."
              exit 1
            fi
            echo "GitHub Release $TAG already represents deployed commit $DEPLOYED_SHA."
            echo "should_create=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve generated release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finalized-release-${{ steps.version.outputs.version }}
          path: |
            tmp/release-notes.customer.md
            tmp/release-notes.engineering.md
            tmp/release-notes.json
          if-no-files-found: error
          retention-days: 30

      - name: Create tag and GitHub Release
        if: steps.release-state.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: >
          gh release create "$TAG"
          --repo "${{ github.repository }}"
          --target "$DEPLOYED_SHA"
          --title "Release v$VERSION"
          --notes-file tmp/release-notes.customer.md

      - name: Reconcile existing GitHub Release notes
        if: steps.release-state.outputs.should_create == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release edit "$TAG"
          --repo "${{ github.repository }}"
          --title "Release v$VERSION"
          --notes-file tmp/release-notes.customer.md

      - name: Fast-forward Beta to the published release
        if: inputs.align_beta
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin main beta
          MAIN_SHA="$(git rev-parse origin/main)"
          BETA_SHA="$(git rev-parse origin/beta)"

          if [[ "$MAIN_SHA" != "$DEPLOYED_SHA" ]]; then
            echo "::error::Main advanced to $MAIN_SHA after release deployment $DEPLOYED_SHA; Beta was not moved."
            exit 1
          fi

          if [[ "$BETA_SHA" == "$DEPLOYED_SHA" ]]; then
            echo "Beta already points to published release $DEPLOYED_SHA."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$BETA_SHA" "$DEPLOYED_SHA"; then
            echo "::error::Beta $BETA_SHA cannot fast-forward to published release $DEPLOYED_SHA."
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/git/refs/heads/beta" \
            -f sha="$DEPLOYED_SHA" \
            -F force=false >/dev/null

          UPDATED_BETA_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/beta" --jq '.object.sha')"
          test "$UPDATED_BETA_SHA" = "$DEPLOYED_SHA"
          echo "Beta fast-forwarded from $BETA_SHA to published release $DEPLOYED_SHA."
