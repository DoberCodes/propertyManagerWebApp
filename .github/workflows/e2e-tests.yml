name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - beta
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'E2E suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - smoke-all
          - workflows
          - full-safe

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.suite || 'smoke' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPENDABOT_ACTIONS_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/github_actions/') }}
      E2E_DEMO_EMAIL: ${{ secrets.E2E_DEMO_EMAIL }}
      E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.E2E_REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.E2E_REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.E2E_REACT_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.E2E_REACT_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.E2E_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.E2E_REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ secrets.E2E_REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY }}
      REACT_APP_STRIPE_PUBLIC_KEY: ''
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.E2E_FIREBASE_SERVICE_ACCOUNT_JSON }}
      E2E_FIREBASE_PROJECT_ID: ${{ secrets.E2E_REACT_APP_FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate e2e environment
        if: env.DEPENDABOT_ACTIONS_PR != 'true'
        shell: bash
        run: |
          missing=0
          for name in \
            E2E_DEMO_EMAIL \
            E2E_DEMO_PASSWORD \
            REACT_APP_FIREBASE_API_KEY \
            REACT_APP_FIREBASE_AUTH_DOMAIN \
            REACT_APP_FIREBASE_PROJECT_ID \
            REACT_APP_FIREBASE_STORAGE_BUCKET \
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID \
            REACT_APP_FIREBASE_APP_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required e2e environment value: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Add E2E_DEMO_EMAIL, E2E_DEMO_PASSWORD, and E2E_REACT_APP_FIREBASE_* GitHub Actions secrets."
            echo "E2E intentionally does not fall back to production Firebase config."
            exit 1
          fi

      - name: Explain credential-free Actions validation
        if: env.DEPENDABOT_ACTIONS_PR == 'true'
        run: >-
          echo "GitHub Actions Dependabot pull request detected. Normal Actions
          secrets are unavailable, so this required check validates workflow
          policy and the updated Actions without exposing demo credentials."

      - name: Resolve e2e suite
        id: suite
        shell: bash
        run: |
          if [[ "$DEPENDABOT_ACTIONS_PR" == "true" ]]; then
            SUITE="actions"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SUITE="smoke"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            SUITE="smoke-all"
          else
            SUITE="${{ github.event.inputs.suite }}"
          fi

          case "$SUITE" in
            actions)
              echo "command=yarn validate:workflows" >> "$GITHUB_OUTPUT"
              echo "browsers=none" >> "$GITHUB_OUTPUT"
              ;;
            smoke)
              echo "command=yarn e2e:smoke:chrome" >> "$GITHUB_OUTPUT"
              echo "browsers=chromium" >> "$GITHUB_OUTPUT"
              ;;
            smoke-all)
              echo "command=yarn e2e:smoke:all" >> "$GITHUB_OUTPUT"
              echo "browsers=all" >> "$GITHUB_OUTPUT"
              ;;
            workflows)
              echo "command=yarn e2e:workflows:chrome" >> "$GITHUB_OUTPUT"
              echo "browsers=chromium" >> "$GITHUB_OUTPUT"
              ;;
            full-safe)
              echo "command=yarn e2e:full-safe" >> "$GITHUB_OUTPUT"
              echo "browsers=all" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown e2e suite: $SUITE"
              exit 1
              ;;
          esac

          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright browsers
        if: steps.suite.outputs.browsers != 'none'
        shell: bash
        run: |
          if [[ "${{ steps.suite.outputs.browsers }}" == "all" ]]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run selected e2e policy
        run: ${{ steps.suite.outputs.command }}

      - name: Cleanup E2E Firebase test data
        if: always() && github.event_name == 'workflow_dispatch' && (steps.suite.outputs.suite == 'workflows' || steps.suite.outputs.suite == 'full-safe')
        shell: bash
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing E2E_FIREBASE_SERVICE_ACCOUNT_JSON secret. Manual E2E suites require cleanup credentials."
            exit 1
          fi

          yarn cleanup:test-data:full

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report-${{ steps.suite.outputs.suite }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-results-${{ steps.suite.outputs.suite }}
          path: test-results
          if-no-files-found: ignore
