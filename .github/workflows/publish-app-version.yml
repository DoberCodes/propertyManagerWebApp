name: Publish App Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true

permissions:
  contents: read

jobs:
  publish-app-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.maintleyapp
        run: |
          VERSION="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          TAG="v$VERSION"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

          mkdir -p tmp
          gh release view "$TAG" --json body --jq '.body // ""' > tmp/release-notes.customer.md

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "play_store_url=$PLAY_STORE_URL" >> "$GITHUB_OUTPUT"

      - name: Publish Firestore app version
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID || vars.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
        run: |
          node scripts/publishAppVersion.cjs \
            --version "${{ steps.release.outputs.version }}" \
            --release-notes-file tmp/release-notes.customer.md \
            --release-url "${{ steps.release.outputs.release_url }}" \
            --play-store-url "${{ steps.release.outputs.play_store_url }}" \
            --json

      - name: Write summary
        run: |
          {
            echo "## App Version Published"
            echo ""
            echo "**Version:** v${{ steps.release.outputs.version }}"
            echo ""
            echo "**Android updates:** ${{ steps.release.outputs.play_store_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
