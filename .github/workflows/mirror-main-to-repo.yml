name: Mirror branch to external repository

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.MIRROR_REPOSITORY_NAME }}" ]; then
            echo "Missing required secret: MIRROR_REPOSITORY_NAME (format: repo-name)"
            exit 1
          fi
          if [ -z "${{ secrets.MIRROR_TOKEN }}" ]; then
            echo "Missing required secret: MIRROR_TOKEN"
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branch to mirror repository (excluding workflow files)
        env:
          MIRROR_OWNER: ${{ github.repository_owner }}
          MIRROR_REPOSITORY_NAME: ${{ secrets.MIRROR_REPOSITORY_NAME }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          MIRROR_URL="https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_OWNER}/${MIRROR_REPOSITORY_NAME}.git"
          WORKDIR="${RUNNER_TEMP}/mirror-repo"

          git clone "${MIRROR_URL}" "${WORKDIR}"
          cd "${WORKDIR}"

          if git ls-remote --heads origin "${SOURCE_BRANCH}" | grep -q "${SOURCE_BRANCH}"; then
            git checkout "${SOURCE_BRANCH}"
          else
            git checkout -b "${SOURCE_BRANCH}"
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "${GITHUB_WORKSPACE}/" "${WORKDIR}/"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror"
            exit 0
          fi

          git commit -m "Mirror ${GITHUB_REPOSITORY}@${GITHUB_SHA} to ${SOURCE_BRANCH}"
          git push origin "${SOURCE_BRANCH}"
