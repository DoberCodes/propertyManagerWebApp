name: Deploy Firebase Environments

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests
        run: yarn test:ci

      - name: Build app
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.PROD_REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_STRIPE_PUBLIC_KEY: ${{ secrets.PROD_REACT_APP_STRIPE_PUBLIC_KEY }}
        run: yarn build

  deploy:
    runs-on: ubuntu-latest
    needs: [build-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Resolve target Firebase project
        id: target
        shell: bash
        run: |
          TARGET="prod"
          PROJECT_ID="${{ secrets.PROD_FIREBASE_PROJECT_ID }}"

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Missing Firebase project id secret for target: $TARGET"
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Deploy Firestore rules and Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [[ -z "$FIREBASE_TOKEN" ]]; then
            echo "FIREBASE_TOKEN secret is required"
            exit 1
          fi

          npx firebase-tools deploy \
            --project "${{ steps.target.outputs.project_id }}" \
            --only firestore:rules,functions \
            --non-interactive \
            --force
