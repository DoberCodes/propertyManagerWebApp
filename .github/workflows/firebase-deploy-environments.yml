name: Deploy Firebase Environments

on:
  push:
    branches:
      - beta
      - main
  workflow_dispatch:
    inputs:
      deploy_targets:
        description: Comma-separated Firebase deploy targets.
        required: false
        default: functions,firestore:rules

jobs:
  development-build:
    name: Build stable development app
    if: github.event_name == 'push' && github.ref_name == 'beta'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate environment contract
        run: yarn env:contract:validate

      - name: Validate development deployment boundary
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          REACT_FIREBASE_PROJECT_ID: ${{ vars.DEV_REACT_APP_FIREBASE_PROJECT_ID }}
          STRIPE_PUBLIC_KEY: ${{ vars.DEV_REACT_APP_STRIPE_PUBLIC_KEY }}
        run: |
          if [[ "$FIREBASE_PROJECT_ID" != "maintleybeta" || "$REACT_FIREBASE_PROJECT_ID" != "maintleybeta" ]]; then
            echo "Refusing to build a stable development release outside Maintley Beta."
            exit 1
          fi

          if [[ "$STRIPE_PUBLIC_KEY" != pk_test_* ]]; then
            echo "Stable development releases require a Stripe pk_test_ publishable key."
            exit 1
          fi

      - name: Build stable Maintley Beta app
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ vars.DEV_REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.DEV_REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.DEV_REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.DEV_REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.DEV_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.DEV_REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.DEV_REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_ENABLE_ANALYTICS: ${{ vars.DEV_REACT_APP_ENABLE_ANALYTICS }}
          REACT_APP_ANALYTICS_DEBUG: ${{ vars.DEV_REACT_APP_ANALYTICS_DEBUG || 'false' }}
          REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ vars.DEV_REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY }}
          REACT_APP_STRIPE_PUBLIC_KEY: ${{ vars.DEV_REACT_APP_STRIPE_PUBLIC_KEY }}
          REACT_APP_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.DEV_REACT_APP_STRIPE_CUSTOMER_PORTAL_URL }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID }}
          REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID }}
          REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID: ${{ vars.DEV_REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID }}
          REACT_APP_WEATHER_API_KEY: ${{ vars.DEV_REACT_APP_WEATHER_API_KEY }}
          REACT_APP_PUBLIC_WEB_URL: ${{ vars.DEV_REACT_APP_PUBLIC_WEB_URL }}
          REACT_APP_PLAY_STORE_URL: ${{ vars.DEV_REACT_APP_PLAY_STORE_URL }}
          REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars.DEV_REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL || 'false' }}
          REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars.DEV_REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE || 'false' }}
          REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION: ${{ vars.DEV_REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION || 'false' }}
          REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES: ${{ vars.DEV_REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES || 'false' }}
          REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars.DEV_REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES || 'false' }}
          REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars.DEV_REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA || 'false' }}
        run: |
          yarn sync:public-pricing
          yarn build
          yarn check:asset-budgets

      - name: Upload stable development build
        uses: actions/upload-artifact@v6
        with:
          name: firebase-stable-development-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 1

  development-deploy:
    name: Deploy stable development environment
    if: github.event_name == 'push' && github.ref_name == 'beta'
    needs: development-build
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: firebase-stable-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve changed backend targets
        id: deploy-targets
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          targets=("hosting:beta")
          backend_targets=()

          if echo "$CHANGED_FILES" | grep -Eq '^functions/'; then
            targets+=("functions")
            backend_targets+=("functions")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^firestore\.rules$'; then
            targets+=("firestore:rules")
            backend_targets+=("firestore:rules")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^storage\.rules$'; then
            targets+=("storage")
            backend_targets+=("storage")
          fi

          TARGETS="$(IFS=,; echo "${targets[*]}")"
          BACKEND_TARGETS="$(IFS=,; echo "${backend_targets[*]}")"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "backend_targets=$BACKEND_TARGETS" >> "$GITHUB_OUTPUT"
          echo "has_backend_targets=$([[ ${#backend_targets[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Stable development deploy targets: $TARGETS"

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Download stable development build
        uses: actions/download-artifact@v6
        with:
          name: firebase-stable-development-${{ github.sha }}
          path: build

      - name: Install root validation dependencies
        if: steps.deploy-targets.outputs.has_backend_targets == 'true'
        run: yarn install --frozen-lockfile

      - name: Use Node.js for Functions
        if: contains(steps.deploy-targets.outputs.backend_targets, 'functions')
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: functions/yarn.lock

      - name: Install Functions dependencies
        if: contains(steps.deploy-targets.outputs.backend_targets, 'functions')
        run: yarn --cwd functions install --frozen-lockfile

      - name: Validate Functions deploy package
        if: contains(steps.deploy-targets.outputs.backend_targets, 'functions')
        run: |
          yarn check:entitlement-locks
          yarn validate:functions-package
          yarn --cwd functions build

      - name: Use Java for Firebase emulators
        if: steps.deploy-targets.outputs.has_backend_targets == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate changed Firebase rules
        if: steps.deploy-targets.outputs.has_backend_targets == 'true'
        run: |
          if [[ "${{ steps.deploy-targets.outputs.backend_targets }}" == *"firestore"* || "${{ steps.deploy-targets.outputs.backend_targets }}" == *"functions"* ]]; then
            yarn test:rules
          fi
          if [[ "${{ steps.deploy-targets.outputs.backend_targets }}" == *"storage"* || "${{ steps.deploy-targets.outputs.backend_targets }}" == *"functions"* ]]; then
            yarn test:storage
          fi

      - name: Authenticate to Maintley Beta
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.DEV_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEV_GOOGLE_SERVICE_ACCOUNT }}

      - name: Verify stable development target
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          REACT_FIREBASE_PROJECT_ID: ${{ vars.DEV_REACT_APP_FIREBASE_PROJECT_ID }}
        run: |
          if [[ "$FIREBASE_PROJECT_ID" != "maintleybeta" || "$REACT_FIREBASE_PROJECT_ID" != "maintleybeta" ]]; then
            echo "Refusing to deploy outside Maintley Beta."
            exit 1
          fi

      - name: Write stable development Functions environment
        if: contains(steps.deploy-targets.outputs.backend_targets, 'functions')
        env:
          MAINTLEY_GITHUB_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: yarn env:bootstrap --environment development --apply --strict --check-secrets

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.22.3

      - name: Deploy stable development environment
        run: |
          firebase deploy \
            --project beta \
            --only "${{ steps.deploy-targets.outputs.targets }}" \
            --non-interactive \
            --force

  development-release-prep:
    name: Update release candidate
    if: github.event_name == 'push' && github.ref_name == 'beta'
    needs: development-deploy
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-prep.yml
    with:
      source_sha: ${{ github.sha }}

  build-check:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests
        run: yarn test:ci

      - name: Validate environment contract
        run: yarn env:contract:validate

      - name: Build app
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ vars.PROD_REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.PROD_REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.PROD_REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.PROD_REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_ENABLE_ANALYTICS: ${{ vars.PROD_REACT_APP_ENABLE_ANALYTICS }}
          REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ vars.PROD_REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY }}
          REACT_APP_STRIPE_PUBLIC_KEY: ${{ vars.PROD_REACT_APP_STRIPE_PUBLIC_KEY }}
          REACT_APP_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.PROD_REACT_APP_STRIPE_CUSTOMER_PORTAL_URL }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID }}
          REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID }}
          REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID }}
          REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID: ${{ vars.PROD_REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID }}
          REACT_APP_WEATHER_API_KEY: ${{ vars.PROD_REACT_APP_WEATHER_API_KEY }}
          REACT_APP_PUBLIC_WEB_URL: ${{ vars.PROD_REACT_APP_PUBLIC_WEB_URL }}
          REACT_APP_PLAY_STORE_URL: ${{ vars.PROD_REACT_APP_PLAY_STORE_URL }}
          REACT_APP_ANALYTICS_DEBUG: ${{ vars.PROD_REACT_APP_ANALYTICS_DEBUG || 'false' }}
          REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars.PROD_REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL || 'false' }}
          REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars.PROD_REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE || 'false' }}
          REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION: ${{ vars.PROD_REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION || 'false' }}
          REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES: ${{ vars.PROD_REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES || 'false' }}
          REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars.PROD_REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES || 'false' }}
          REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars.PROD_REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA || 'false' }}
        run: |
          yarn sync:public-pricing
          yarn build

      - name: Upload production Hosting build
        uses: actions/upload-artifact@v6
        with:
          name: firebase-production-hosting-${{ github.sha }}
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    needs: [build-check]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an exact release merge for production Hosting
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SUBJECT="$(git log -1 --format=%s HEAD)"
          ESCAPED_VERSION="${VERSION//./\\.}"
          if ! printf '%s\n' "$SUBJECT" | grep -Eq "^Release v${ESCAPED_VERSION} \\(#[0-9]+\\)$"; then
            echo "::error::Production deployment requires the Release v$VERSION pull-request merge. Found: $SUBJECT"
            exit 1
          fi


      - name: Resolve target Firebase project
        id: target
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          REACT_FIREBASE_PROJECT_ID: ${{ vars.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
        run: |
          TARGET="prod"
          PROJECT_ID="${FIREBASE_PROJECT_ID:-$REACT_FIREBASE_PROJECT_ID}"

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Missing Firebase project id secret for target: $TARGET"
            echo "Set PROD_FIREBASE_PROJECT_ID or PROD_REACT_APP_FIREBASE_PROJECT_ID."
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Firebase deploy targets
        id: deploy-targets
        shell: bash
        env:
          MANUAL_DEPLOY_TARGETS: ${{ github.event.inputs.deploy_targets }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGETS="${MANUAL_DEPLOY_TARGETS// /}"
            if [[ -z "$TARGETS" ]]; then
              TARGETS="functions,firestore:rules"
            fi

            if [[ "$TARGETS" == *"hosting"* ]]; then
              echo "::error::Production Hosting deploys only from an exact release merge to main."
              exit 1
            fi

            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "Manual Firebase deploy targets: $TARGETS"
            exit 0
          fi

          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          targets=("hosting:prod")

          if echo "$CHANGED_FILES" | grep -Eq '^functions/'; then
            targets+=("functions")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^firestore\.rules$'; then
            targets+=("firestore:rules")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^storage\.rules$'; then
            targets+=("storage")
          fi

          TARGETS="$(IFS=,; echo "${targets[*]}")"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          echo "Firebase deploy targets: $TARGETS"

      - name: Download production Hosting build
        if: github.event_name == 'push'
        uses: actions/download-artifact@v6
        with:
          name: firebase-production-hosting-${{ github.sha }}
          path: build

      - name: Use Node.js for root validation dependencies
        if: steps.deploy-targets.outputs.has_targets == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root validation dependencies
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: yarn install --frozen-lockfile

      - name: Use Node.js for Functions
        if: contains(steps.deploy-targets.outputs.targets, 'functions')
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: functions/yarn.lock

      - name: Install functions dependencies
        if: contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions install --frozen-lockfile

      - name: Install pinned Firebase CLI
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: npm install --global firebase-tools@15.22.3

      - name: Require an entitlement package version bump
        if: github.event_name == 'push' && steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        env:
          ENTITLEMENT_PACKAGE_BASE_REF: ${{ github.event.before }}
        run: yarn check:entitlement-package-version

      - name: Check entitlement lock synchronization
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn check:entitlement-locks

      - name: Validate Functions deploy package
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn validate:functions-package

      - name: Build functions
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions build

      - name: Property setup activation tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:setup-plan

      - name: Recurring task entitlement tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:recurring-task

      - name: Manual occupancy continuity tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:manual-occupancy

      - name: Stripe billing disclosure tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:billing-disclosure

      - name: Admin entitlement grant policy tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testAdminEntitlementGrantPolicy.cjs

      - name: Email branding and lifecycle template tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testEmailTemplates.cjs

      - name: Access lifecycle billing classification tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:access-lifecycle-billing

      - name: Maintley Event lifecycle delivery tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testMaintleyEventEngine.cjs

      - name: Use Java for Firebase emulators
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'firestore') || contains(steps.deploy-targets.outputs.targets, 'storage'))
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'firestore'))
        run: yarn test:rules

      - name: Entitlement grant issuance tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node ./functions/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore "node scripts/testEntitlementGrantIssuance.cjs"

      - name: Complimentary access code tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn test:access-codes

      - name: Trusted storage quota rules tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'storage'))
        run: yarn test:storage

      - name: Authenticate to Google Cloud
        if: steps.deploy-targets.outputs.has_targets == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ steps.target.outputs.project_id }}

      - name: Write Functions deploy environment
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        env:
          STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID: ${{ vars.PROD_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID }}
          STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID: ${{ vars.PROD_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID }}
          ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars.PROD_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL || 'false' }}
          ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars.PROD_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE || 'false' }}
          ENABLE_COMPLIMENTARY_PAID_TRANSITIONS: ${{ vars.PROD_ENABLE_COMPLIMENTARY_PAID_TRANSITIONS || 'false' }}
          ENABLE_ACCESS_LIFECYCLE_COMMUNICATION: ${{ vars.PROD_ENABLE_ACCESS_LIFECYCLE_COMMUNICATION || 'false' }}
          ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars.PROD_ENABLE_COMPLIMENTARY_ACCESS_CODES || 'false' }}
          ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars.PROD_ENABLE_TRUSTED_STORAGE_QUOTA || 'false' }}
          HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT: ${{ vars.PROD_HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT || '' }}
          APP_URL: ${{ vars.PROD_APP_URL }}
          APP_ROUTER_MODE: ${{ vars.PROD_APP_ROUTER_MODE }}
          MAINTLEY_ENVIRONMENT: ${{ vars.PROD_MAINTLEY_ENVIRONMENT }}
          ENTITLEMENT_COMPARE_MODE: ${{ vars.PROD_ENTITLEMENT_COMPARE_MODE || 'false' }}
          SUPPORT_EMAIL: ${{ vars.PROD_SUPPORT_EMAIL }}
          HELP_CENTER_URL: ${{ vars.PROD_HELP_CENTER_URL }}
          RESEND_FROM_EMAIL: ${{ vars.PROD_RESEND_FROM_EMAIL }}
          RESEND_FEEDBACK_FROM_EMAIL: ${{ vars.PROD_RESEND_FEEDBACK_FROM_EMAIL }}
          RESEND_API_KEY_SECRET_NAME: ${{ vars.PROD_RESEND_API_KEY_SECRET_NAME || 'RESEND_API_KEY' }}
          STRIPE_PROPERTY_MONTHLY_PRICE_ID: ${{ vars.PROD_STRIPE_PROPERTY_MONTHLY_PRICE_ID }}
          STRIPE_PROPERTY_ANNUAL_PRICE_ID: ${{ vars.PROD_STRIPE_PROPERTY_ANNUAL_PRICE_ID }}
          STRIPE_PORTFOLIO_MONTHLY_PRICE_ID: ${{ vars.PROD_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID }}
          STRIPE_PORTFOLIO_ANNUAL_PRICE_ID: ${{ vars.PROD_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID }}
        run: |
          missing=0
          for name in \
            STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID \
            STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID \
            STRIPE_PROPERTY_MONTHLY_PRICE_ID \
            STRIPE_PROPERTY_ANNUAL_PRICE_ID \
            STRIPE_PORTFOLIO_MONTHLY_PRICE_ID \
            STRIPE_PORTFOLIO_ANNUAL_PRICE_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Functions deploy environment value: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Add the PROD_STRIPE_* variables to the GitHub production environment."
            exit 1
          fi

          {
            echo "STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID=$STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID"
            echo "STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID=$STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID"
            echo "ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL=$ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL"
            echo "ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE=$ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE"
            echo "ENABLE_COMPLIMENTARY_PAID_TRANSITIONS=$ENABLE_COMPLIMENTARY_PAID_TRANSITIONS"
            echo "ENABLE_ACCESS_LIFECYCLE_COMMUNICATION=$ENABLE_ACCESS_LIFECYCLE_COMMUNICATION"
            echo "ENABLE_COMPLIMENTARY_ACCESS_CODES=$ENABLE_COMPLIMENTARY_ACCESS_CODES"
            echo "ENABLE_TRUSTED_STORAGE_QUOTA=$ENABLE_TRUSTED_STORAGE_QUOTA"
            echo "HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT=$HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT"
            echo "APP_URL=$APP_URL"
            echo "APP_ROUTER_MODE=$APP_ROUTER_MODE"
            echo "MAINTLEY_ENVIRONMENT=$MAINTLEY_ENVIRONMENT"
            echo "ENTITLEMENT_COMPARE_MODE=$ENTITLEMENT_COMPARE_MODE"
            echo "SUPPORT_EMAIL=$SUPPORT_EMAIL"
            echo "HELP_CENTER_URL=$HELP_CENTER_URL"
            echo "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL"
            echo "RESEND_FEEDBACK_FROM_EMAIL=$RESEND_FEEDBACK_FROM_EMAIL"
            echo "RESEND_API_KEY_SECRET_NAME=$RESEND_API_KEY_SECRET_NAME"
            echo "STRIPE_PROPERTY_MONTHLY_PRICE_ID=$STRIPE_PROPERTY_MONTHLY_PRICE_ID"
            echo "STRIPE_PROPERTY_ANNUAL_PRICE_ID=$STRIPE_PROPERTY_ANNUAL_PRICE_ID"
            echo "STRIPE_PORTFOLIO_MONTHLY_PRICE_ID=$STRIPE_PORTFOLIO_MONTHLY_PRICE_ID"
            echo "STRIPE_PORTFOLIO_ANNUAL_PRICE_ID=$STRIPE_PORTFOLIO_ANNUAL_PRICE_ID"
          } > functions/.env.prod

      - name: Deploy selected production Firebase targets
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: |
          firebase deploy \
            --project "${{ steps.target.outputs.target }}" \
            --only "${{ steps.deploy-targets.outputs.targets }}" \
            --non-interactive \
            --force

  finalize-release:
    name: Publish deployed web release
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/finalize-web-release.yml
    with:
      deployed_sha: ${{ github.sha }}
      hosting_target: firebase-hosting
