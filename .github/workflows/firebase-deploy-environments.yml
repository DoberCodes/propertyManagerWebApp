name: Deploy Firebase Environments

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_targets:
        description: Comma-separated Firebase deploy targets.
        required: false
        default: functions,firestore:rules

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Unit tests
        run: yarn test:ci

      - name: Build app
        env:
          CI: false
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.PROD_REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_ENABLE_ANALYTICS: ${{ secrets.PROD_REACT_APP_ENABLE_ANALYTICS }}
          REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ secrets.PROD_REACT_APP_FIREBASE_WEB_PUSH_VAPID_KEY }}
          REACT_APP_STRIPE_PUBLIC_KEY: ${{ secrets.PROD_REACT_APP_STRIPE_PUBLIC_KEY }}
          REACT_APP_STRIPE_CUSTOMER_PORTAL_URL: ${{ vars.STRIPE_CUSTOMER_PORTAL_URL || 'https://billing.stripe.com/p/login/00wbJ27029Gxama5Cg5gc00' }}
          REACT_APP_ENABLE_MULTI_HOMEOWNER_PLAN: ${{ vars.ENABLE_MULTI_HOMEOWNER_PLAN || 'false' }}
          REACT_APP_ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars.ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL || 'false' }}
          REACT_APP_ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars.ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE || 'false' }}
          REACT_APP_ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION: ${{ vars.ENABLE_TRUSTED_SETUP_PLAN_ACTIVATION || 'false' }}
          REACT_APP_ENABLE_TRUSTED_RECURRING_TASK_WRITES: ${{ vars.ENABLE_TRUSTED_RECURRING_TASK_WRITES || 'false' }}
          REACT_APP_ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars.ENABLE_COMPLIMENTARY_ACCESS_CODES || 'false' }}
          REACT_APP_ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars.ENABLE_TRUSTED_STORAGE_QUOTA || 'false' }}
        run: |
          yarn sync:public-pricing
          yarn build

  deploy:
    runs-on: ubuntu-latest
    needs: [build-check]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Resolve target Firebase project
        id: target
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          REACT_FIREBASE_PROJECT_ID: ${{ secrets.PROD_REACT_APP_FIREBASE_PROJECT_ID }}
        run: |
          TARGET="prod"
          PROJECT_ID="${FIREBASE_PROJECT_ID:-$REACT_FIREBASE_PROJECT_ID}"

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Missing Firebase project id secret for target: $TARGET"
            echo "Set PROD_FIREBASE_PROJECT_ID or PROD_REACT_APP_FIREBASE_PROJECT_ID."
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Firebase deploy targets
        id: deploy-targets
        shell: bash
        env:
          MANUAL_DEPLOY_TARGETS: ${{ github.event.inputs.deploy_targets }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGETS="${MANUAL_DEPLOY_TARGETS// /}"
            if [[ -z "$TARGETS" ]]; then
              TARGETS="functions,firestore:rules"
            fi

            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "Manual Firebase deploy targets: $TARGETS"
            exit 0
          fi

          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only HEAD~1 HEAD)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          targets=()

          if echo "$CHANGED_FILES" | grep -Eq '(^functions/|^firebase\.json$)'; then
            targets+=("functions")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '(^firestore\.rules$|^firebase\.json$)'; then
            targets+=("firestore:rules")
          fi

          if echo "$CHANGED_FILES" | grep -Eq '(^storage\.rules$|^firebase\.json$)'; then
            targets+=("storage")
          fi

          if [[ "${#targets[@]}" -eq 0 ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No Firebase deploy targets changed."
            exit 0
          fi

          TARGETS="$(IFS=,; echo "${targets[*]}")"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"
          echo "Firebase deploy targets: $TARGETS"

      - name: Use Node.js for root validation dependencies
        if: steps.deploy-targets.outputs.has_targets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install root validation dependencies
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: yarn install --frozen-lockfile

      - name: Use Node.js for Functions
        if: steps.deploy-targets.outputs.has_targets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: functions/yarn.lock

      - name: Install functions dependencies
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: yarn --cwd functions install --frozen-lockfile

      - name: Require an entitlement package version bump
        if: github.event_name == 'push' && steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        env:
          ENTITLEMENT_PACKAGE_BASE_REF: ${{ github.event.before }}
        run: yarn check:entitlement-package-version

      - name: Validate Functions deploy package
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn validate:functions-package

      - name: Build functions
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions build

      - name: Property setup activation tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:setup-plan

      - name: Recurring task entitlement tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:recurring-task

      - name: Manual occupancy continuity tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:manual-occupancy

      - name: Stripe billing disclosure tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn --cwd functions test:billing-disclosure

      - name: Admin entitlement grant policy tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testAdminEntitlementGrantPolicy.cjs

      - name: Email branding and lifecycle template tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testEmailTemplates.cjs

      - name: Maintley Event lifecycle delivery tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node scripts/testMaintleyEventEngine.cjs

      - name: Use Java for Firebase emulators
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'firestore') || contains(steps.deploy-targets.outputs.targets, 'storage'))
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'firestore'))
        run: yarn test:rules

      - name: Entitlement grant issuance tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: node ./functions/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore "node scripts/testEntitlementGrantIssuance.cjs"

      - name: Complimentary access code tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        run: yarn test:access-codes

      - name: Trusted storage quota rules tests
        if: steps.deploy-targets.outputs.has_targets == 'true' && (contains(steps.deploy-targets.outputs.targets, 'functions') || contains(steps.deploy-targets.outputs.targets, 'storage'))
        run: yarn test:storage

      - name: Authenticate to Google Cloud
        if: steps.deploy-targets.outputs.has_targets == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ steps.target.outputs.project_id }}

      - name: Write Functions deploy environment
        if: steps.deploy-targets.outputs.has_targets == 'true' && contains(steps.deploy-targets.outputs.targets, 'functions')
        env:
          STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID: ${{ secrets.PROD_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID }}
          STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID: ${{ secrets.PROD_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID }}
          STRIPE_MULTI_HOMEOWNER_MONTHLY_PRICE_ID: ${{ secrets.PROD_STRIPE_MULTIPLE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID }}
          STRIPE_MULTI_HOMEOWNER_ANNUAL_PRICE_ID: ${{ secrets.PROD_STRIPE_MULTIPLE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID }}
          ENABLE_MULTI_HOMEOWNER_PLAN: ${{ vars.ENABLE_MULTI_HOMEOWNER_PLAN || 'false' }}
          ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL: ${{ vars.ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL || 'false' }}
          ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE: ${{ vars.ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE || 'false' }}
          ENABLE_COMPLIMENTARY_PAID_TRANSITIONS: ${{ vars.ENABLE_COMPLIMENTARY_PAID_TRANSITIONS || 'false' }}
          ENABLE_ACCESS_LIFECYCLE_COMMUNICATION: ${{ vars.ENABLE_ACCESS_LIFECYCLE_COMMUNICATION || 'false' }}
          ENABLE_COMPLIMENTARY_ACCESS_CODES: ${{ vars.ENABLE_COMPLIMENTARY_ACCESS_CODES || 'false' }}
          ENABLE_TRUSTED_STORAGE_QUOTA: ${{ vars.ENABLE_TRUSTED_STORAGE_QUOTA || 'false' }}
          HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT: ${{ vars.HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT || '' }}
          STRIPE_PROPERTY_MONTHLY_PRICE_ID: ${{ secrets.PROD_STRIPE_PROPERTY_MONTHLY_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_PROPERTY_MONTHLY_PRICE_ID }}
          STRIPE_PROPERTY_ANNUAL_PRICE_ID: ${{ secrets.PROD_STRIPE_PROPERTY_ANNUAL_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_PROPERTY_ANNUAL_PRICE_ID }}
          STRIPE_PORTFOLIO_MONTHLY_PRICE_ID: ${{ secrets.PROD_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_PORTFOLIO_MONTHLY_PRICE_ID }}
          STRIPE_PORTFOLIO_ANNUAL_PRICE_ID: ${{ secrets.PROD_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID || secrets.PROD_REACT_APP_STRIPE_PORTFOLIO_ANNUAL_PRICE_ID }}
        run: |
          missing=0
          for name in \
            STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID \
            STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID \
            STRIPE_MULTI_HOMEOWNER_MONTHLY_PRICE_ID \
            STRIPE_MULTI_HOMEOWNER_ANNUAL_PRICE_ID \
            STRIPE_PROPERTY_MONTHLY_PRICE_ID \
            STRIPE_PROPERTY_ANNUAL_PRICE_ID \
            STRIPE_PORTFOLIO_MONTHLY_PRICE_ID \
            STRIPE_PORTFOLIO_ANNUAL_PRICE_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Functions deploy environment value: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Add the PROD_STRIPE_* GitHub Actions secrets, or matching PROD_REACT_APP_STRIPE_* fallback secrets."
            exit 1
          fi

          {
            echo "STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID=$STRIPE_HOMEOWNER_PLUS_MONTHLY_PRICE_ID"
            echo "STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID=$STRIPE_HOMEOWNER_PLUS_ANNUAL_PRICE_ID"
            echo "STRIPE_MULTI_HOMEOWNER_MONTHLY_PRICE_ID=$STRIPE_MULTI_HOMEOWNER_MONTHLY_PRICE_ID"
            echo "STRIPE_MULTI_HOMEOWNER_ANNUAL_PRICE_ID=$STRIPE_MULTI_HOMEOWNER_ANNUAL_PRICE_ID"
            echo "ENABLE_MULTI_HOMEOWNER_PLAN=$ENABLE_MULTI_HOMEOWNER_PLAN"
            echo "ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL=$ENABLE_HOMEOWNER_PLUS_PRODUCT_TRIAL"
            echo "ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE=$ENABLE_INTERNAL_ENTITLEMENT_GRANT_ISSUANCE"
            echo "ENABLE_COMPLIMENTARY_PAID_TRANSITIONS=$ENABLE_COMPLIMENTARY_PAID_TRANSITIONS"
            echo "ENABLE_ACCESS_LIFECYCLE_COMMUNICATION=$ENABLE_ACCESS_LIFECYCLE_COMMUNICATION"
            echo "ENABLE_COMPLIMENTARY_ACCESS_CODES=$ENABLE_COMPLIMENTARY_ACCESS_CODES"
            echo "ENABLE_TRUSTED_STORAGE_QUOTA=$ENABLE_TRUSTED_STORAGE_QUOTA"
            echo "HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT=$HOMEOWNER_PLUS_TRIAL_ELIGIBILITY_START_AT"
            echo "STRIPE_PROPERTY_MONTHLY_PRICE_ID=$STRIPE_PROPERTY_MONTHLY_PRICE_ID"
            echo "STRIPE_PROPERTY_ANNUAL_PRICE_ID=$STRIPE_PROPERTY_ANNUAL_PRICE_ID"
            echo "STRIPE_PORTFOLIO_MONTHLY_PRICE_ID=$STRIPE_PORTFOLIO_MONTHLY_PRICE_ID"
            echo "STRIPE_PORTFOLIO_ANNUAL_PRICE_ID=$STRIPE_PORTFOLIO_ANNUAL_PRICE_ID"
          } > functions/.env

      - name: Deploy Firebase rules and Functions
        if: steps.deploy-targets.outputs.has_targets == 'true'
        run: |
          ./functions/node_modules/.bin/firebase deploy \
            --project "${{ steps.target.outputs.project_id }}" \
            --only "${{ steps.deploy-targets.outputs.targets }}" \
            --non-interactive \
            --force
