name: Align Beta with Main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-backend-readiness:
    name: Beta backend readiness
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Maintley Beta backend readiness
        uses: ./.github/actions/verify-beta-backend-readiness
        with:
          project_id: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.DEV_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEV_GOOGLE_SERVICE_ACCOUNT }}
          github_variables_json: ${{ toJSON(vars) }}

  align-beta:
    name: Fast-forward Beta to Main
    if: github.ref_name == 'main'
    needs: beta-backend-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward Beta without a merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin main beta
          TARGET_SHA="$(git rev-parse origin/main)"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          BETA_SHA="$(git rev-parse origin/beta)"

          if [[ "$CHECKED_OUT_SHA" != "$TARGET_SHA" ]]; then
            echo "::error::Workflow checkout $CHECKED_OUT_SHA is not current Main $TARGET_SHA."
            exit 1
          fi

          if [[ "$BETA_SHA" == "$TARGET_SHA" ]]; then
            echo "Beta already matches Main at $TARGET_SHA."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$BETA_SHA" "$TARGET_SHA"; then
            echo "::error::Beta $BETA_SHA has diverged and cannot fast-forward to Main $TARGET_SHA."
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/git/refs/heads/beta" \
            -f sha="$TARGET_SHA" \
            -F force=false >/dev/null

          UPDATED_BETA_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/beta" --jq '.object.sha')"
          test "$UPDATED_BETA_SHA" = "$TARGET_SHA"
          echo "Beta fast-forwarded from $BETA_SHA to Main $TARGET_SHA."
