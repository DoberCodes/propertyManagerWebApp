		<style>
			html,
			body,
			#root {
				min-height: 100%;
				margin: 0;
				background: #047857;
			}

			body {
				font-family:
					Manrope,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}

			.maintley-shell-loader {
				box-sizing: border-box;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				min-height: 100dvh;
				padding: 24px;
				background: linear-gradient(135deg, #047857 0%, #009e71 100%);
			}

			.maintley-shell-loader__card {
				box-sizing: border-box;
				display: flex;
				width: min(420px, 100%);
				flex-direction: column;
				align-items: center;
				gap: 18px;
				padding: 34px 28px;
				border-radius: 22px;
				background: rgba(255, 255, 255, 0.94);
				box-shadow: 0 26px 80px rgba(3, 97, 81, 0.32);
				text-align: center;
			}

			.maintley-shell-loader__wordmark {
				color: #047857;
				font-size: clamp(34px, 8vw, 48px);
				font-weight: 700;
				line-height: 1;
			}

			.maintley-shell-loader__house {
				width: 86px;
				height: 76px;
				overflow: visible;
			}

			.maintley-shell-loader__roof {
				animation: maintley-shell-roof 1.8s ease-in-out infinite;
				transform-box: fill-box;
				transform-origin: center;
			}

			.maintley-shell-loader__block {
				animation: maintley-shell-block 1.8s ease-in-out infinite;
				transform-box: fill-box;
				transform-origin: center;
			}

			.maintley-shell-loader__block--two {
				animation-delay: 0.14s;
			}

			.maintley-shell-loader__block--three {
				animation-delay: 0.28s;
			}

			.maintley-shell-loader__block--four {
				animation-delay: 0.42s;
			}

			.maintley-shell-loader__title {
				color: #1f2937;
				font-size: 18px;
				font-weight: 700;
				line-height: 1.3;
			}

			.maintley-shell-loader__message {
				min-height: 20px;
				color: #4b5563;
				font-size: 14px;
				line-height: 1.45;
			}

			.maintley-shell-loader__dots {
				display: flex;
				gap: 6px;
				align-items: center;
				justify-content: center;
			}

			.maintley-shell-loader__dots span {
				width: 6px;
				height: 6px;
				border-radius: 999px;
				background: rgba(4, 120, 87, 0.22);
				animation: maintley-shell-dot 1.2s ease-in-out infinite;
			}

			.maintley-shell-loader__dots span:nth-child(2) {
				animation-delay: 0.18s;
			}

			.maintley-shell-loader__dots span:nth-child(3) {
				animation-delay: 0.36s;
			}

			@keyframes maintley-shell-roof {
				0%,
				34% {
					opacity: 0;
					transform: translateY(-14px) scale(0.88);
				}

				58%,
				86% {
					opacity: 1;
					transform: translateY(0) scale(1);
				}

				100% {
					opacity: 0.55;
					transform: translateY(0) scale(1);
				}
			}

			@keyframes maintley-shell-block {
				0% {
					opacity: 0;
					transform: translateY(18px) scale(0.88);
				}

				28%,
				78% {
					opacity: 1;
					transform: translateY(0) scale(1);
				}

				100% {
					opacity: 0.45;
					transform: translateY(0) scale(1);
				}
			}

			@keyframes maintley-shell-dot {
				0%,
				100% {
					opacity: 0.35;
					transform: scale(1);
				}

				50% {
					opacity: 1;
					transform: scale(1.35);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.maintley-shell-loader__roof,
				.maintley-shell-loader__block,
				.maintley-shell-loader__dots span {
					animation: none;
				}
			}
		</style>
		<title>Maintley</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root">
			<div class="maintley-shell-loader" role="status" aria-live="polite">
				<div class="maintley-shell-loader__card">
					<div class="maintley-shell-loader__wordmark">Maintley</div>
					<svg
						class="maintley-shell-loader__house"
						viewBox="0 0 86 76"
						role="img"
						aria-label="Building property records">
						<g class="maintley-shell-loader__roof">
							<path
								d="M16 37 L43 14 L70 37 L64 43 L43 25 L22 43 Z"
								fill="#047857"
							/>
						</g>
						<rect
							x="21"
							y="34"
							width="44"
							height="34"
							rx="8"
							fill="#effcf5"
							stroke="rgba(0, 158, 113, 0.46)"
							stroke-width="1.5"
						/>
						<rect
							class="maintley-shell-loader__block maintley-shell-loader__block--one"
							x="28"
							y="41"
							width="14"
							height="10"
							rx="3"
							fill="#047857"
						/>
						<rect
							class="maintley-shell-loader__block maintley-shell-loader__block--two"
							x="45"
							y="41"
							width="14"
							height="10"
							rx="3"
							fill="#047857"
						/>
						<rect
							class="maintley-shell-loader__block maintley-shell-loader__block--three"
							x="28"
							y="55"
							width="14"
							height="10"
							rx="3"
							fill="#047857"
						/>
						<rect
							class="maintley-shell-loader__block maintley-shell-loader__block--four"
							x="45"
							y="55"
							width="14"
							height="10"
							rx="3"
							fill="#047857"
						/>
					</svg>
					<div class="maintley-shell-loader__title">Getting Maintley ready</div>
					<div class="maintley-shell-loader__message">
						Preparing your property records...
					</div>
					<div class="maintley-shell-loader__dots" aria-hidden="true">
						<span></span>
						<span></span>
						<span></span>
					</div>
				</div>
			</div>
		</div>
